# mu-dev local store stack — REAL stores for integration tests (DEV-STANDARDS: ZERO mocks).
# DEDICATED mu-dev-* instances ONLY. NEVER touches gcmem-* or milvus-standalone (shared box).
# Images are all cached locally — no network pull. Host ports chosen free (avoid 6333/19530).
#
#   run:    docker compose -f docker-compose.dev.yml up -d
#   verify: docker compose -f docker-compose.dev.yml ps
#   stop:   docker compose -f docker-compose.dev.yml down          (add -v to drop volumes)
#
# Host ports (wired into .env.test -> central Settings, never hardcoded in code):
#   postgres  15432 -> 5432   |  cache/valkey 16379 -> 6379
#   qdrant    16333 -> 6333 (REST), 16334 -> 6334 (gRPC)  |  falkordb 16380 -> 6379
#   mysql     13306 -> 3306   |  memcached 11211 -> 11211

name: mu-dev

services:
  postgres:
    image: postgres:16-alpine
    container_name: mu-dev-postgres
    environment:
      POSTGRES_USER: mu
      POSTGRES_PASSWORD: mu_dev_pw
      POSTGRES_DB: mu
    ports:
      - "127.0.0.1:15432:5432"
    volumes:
      - mu-dev-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mu -d mu"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    networks: [mu-dev]

  cache:
    # Valkey (BSD) — the decided KV/STM store; NOT Redis (SSPL-relicensed). Wire-compatible.
    image: valkey/valkey:8-alpine
    container_name: mu-dev-cache
    command: ["valkey-server", "--appendonly", "yes"]
    ports:
      - "127.0.0.1:16379:6379"
    volumes:
      - mu-dev-cache-data:/data
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    networks: [mu-dev]

  qdrant:
    image: qdrant/qdrant:v1.12.5
    container_name: mu-dev-qdrant
    ports:
      - "127.0.0.1:16333:6333"
      - "127.0.0.1:16334:6334"
    volumes:
      - mu-dev-qdrant-data:/qdrant/storage
    ulimits:
      # RAISED (2026-07-28, real incident): the default 1024 soft nofile limit was exhausted by
      # RocksDB segment files accumulated across many prior dev/demo runs against the
      # `mu_mtm__demo__private__384` collection — Qdrant panicked on startup itself once the
      # on-disk segment count exceeded 1024 open fds (`Os { code: 24, "Too many open files" }`,
      # observed directly via `docker logs mu-dev-qdrant`). This does not touch/delete any data
      # (same named volume) — it only raises the container's own fd ceiling.
      nofile:
        soft: 65536
        hard: 65536
    healthcheck:
      # qdrant image ships no curl/wget; bash /dev/tcp is the dependency-free readiness probe.
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/6333' 2>/dev/null || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 15
      start_period: 10s
    networks: [mu-dev]

  falkordb:
    image: falkordb/falkordb:v4.20.1
    container_name: mu-dev-falkordb
    ports:
      - "127.0.0.1:16380:6379"
    volumes:
      - mu-dev-falkordb-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    networks: [mu-dev]

  mysql:
    # relational role, new backend (owner stage: KV+RELATIONAL multi-backend). SQLAlchemy Core
    # stays DB-agnostic (storage-pluggable-spec.md §2.1/§3.1) — no MySQL-only SQL in the adapter.
    image: mysql:8
    container_name: mu-dev-mysql
    environment:
      MYSQL_ROOT_PASSWORD: mu_dev_pw
      MYSQL_USER: mu
      MYSQL_PASSWORD: mu_dev_pw
      MYSQL_DATABASE: mu
    ports:
      - "127.0.0.1:13306:3306"
    volumes:
      - mu-dev-mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-u", "mu", "-pmu_dev_pw"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 20s
    networks: [mu-dev]

  memcached:
    # KV/STM role, new backend (spec §3.2) — no sorted-set floor (D6); the adapter emulates a
    # bounded recency list via a single CAS-guarded key (see memcached_stm.py docstring).
    image: memcached:1.6-alpine
    container_name: mu-dev-memcached
    ports:
      - "127.0.0.1:11211:11211"
    healthcheck:
      test: ["CMD-SHELL", "echo stats | nc -w 2 127.0.0.1 11211 || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    networks: [mu-dev]

  pgvector:
    # ALTERNATE MTM vector backend (storage-pluggable-spec.md §3.3) — a SEPARATE Postgres endpoint
    # from the `postgres` control-plane service above, on its own host port (15433), matching
    # MU_STORAGE__PGVECTOR__* in .env.test. Without this service the six pgvector integration
    # tests fail on connection-refused, so the "config-driven MTM backend swap is behaviour-
    # identical across Qdrant/Chroma/FAISS/pgvector" claim is not reproducible from the
    # committed infra — the exact gap this service closes.
    image: pgvector/pgvector:pg16
    container_name: mu-dev-pgvector
    environment:
      POSTGRES_USER: mu
      POSTGRES_PASSWORD: mu
      POSTGRES_DB: mu
    ports:
      - "127.0.0.1:15433:5432"
    volumes:
      - mu-dev-pgvector-data:/var/lib/postgresql/data
      # Pre-creates the `vector` extension on first boot — asyncpg fixes its type map at pool
      # creation, so the extension must exist BEFORE the adapter's own pool connects.
      - ./docker/pgvector-init.sql:/docker-entrypoint-initdb.d/10-pgvector.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mu -d mu"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    networks: [mu-dev]

volumes:
  mu-dev-postgres-data:
  mu-dev-pgvector-data:
  mu-dev-cache-data:
  mu-dev-qdrant-data:
  mu-dev-falkordb-data:
  mu-dev-mysql-data:

networks:
  mu-dev:
    name: mu-dev
