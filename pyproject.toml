# mu-core — uv workspace root (VIRTUAL: no [project], not itself a distribution).
# Ships five OPEN distributions from packages/*  (PACKAGING-v2 §1.2, §1.3):
#   mu-contracts, mu-engine, mu-local, mu-engine-server  (mu-sdk scaffolded in the mu-sdk-python repo).
# mu-engine-server (design 2026-07-31-sdk-engine-server-design.md §2.1/§8): thin single-tenant
# HTTP server over the SurfaceFacade, depends on {mu-contracts, mu-engine} ONLY — never mu-local,
# never mu-server, never mu-client (CI: .importlinter mu-engine-server-boundary).
# This root carries ONLY the workspace declaration, the shared dev toolchain,
# and the tool configs (mypy/pytest live here; ruff -> ruff.toml; import-linter -> .importlinter).

[tool.uv.workspace]
members = ["packages/mu-contracts", "packages/mu-engine", "packages/mu-local", "packages/mu-engine-server"]

# In-project cross-package edges are resolved from the workspace, never PyPI
# (PACKAGING-v2 §5.4/§5.5: version-pinned at extraction time; workspace-linked pre-split).
[tool.uv.sources]
mu-contracts = { workspace = true }
mu-engine = { workspace = true }
mu-local = { workspace = true }
mu-engine-server = { workspace = true }
# TEST-ONLY, and deliberately kept out of every package's `[project.dependencies]`: mu-core is the
# Apache-2.0 OPEN half and must never gain a RUNTIME dependency on its own client SDK. This source
# backs the `acceptance` dependency group below ONLY. Sibling repo under mu_project/, not a
# workspace member (the ratified 5-repo split, PACKAGING-v2 banner item 1) -> directory dep.
# `editable = true` for the CO-6 reason mu-sdk-python's own pyproject records: mu-sdk pulls in
# mu-contracts (+ mu-local via its `[embedded]` extra), which this workspace already resolves
# editable via `{ workspace = true }`; a non-editable source for the same path would make uv report
# "conflicting URLs for package `mu-contracts`" and refuse to resolve.
mu-sdk = { path = "../mu-sdk-python", editable = true }

# Dev toolchain (PEP 735 dependency-groups; installed with `uv sync`).
[dependency-groups]
dev = [
    "pytest>=8.3,<9",
    "pytest-asyncio>=0.24,<0.25",
    "mypy>=1.13,<2",
    "ruff>=0.8,<0.9",
    "import-linter>=2.1,<3",
    "testcontainers>=4.9,<5",
]

# The Stage F acceptance gate (packages/mu-engine-server/tests/acceptance/) drives the PUBLIC
# `mu_sdk.MemoryClient` against the containerized engine-server — F1's portability-parity claim
# ("the same caller code works embedded and over the wire") cannot be proven without it, and it
# was going unproven: both F1 and F3 sat behind `pytest.importorskip("mu_sdk")` and never ran.
# mu-server already carries the identical test-only edge for the identical reason
# (mu-server/pyproject.toml `dev` group: "a release-gate criterion that silently skips is exactly
# the failure it was written to end", WIRE-CONFORMANCE-FINDING-0821.md §"mu-sdk is now test-only").
#
# NON-DEFAULT group ON PURPOSE (this is the one place mu-core differs from mu-server, and why):
# mu-server is the private plane and never ships alone, but mu-core is the OPEN repo whose whole
# promise is that it depends on nothing. Putting a hard `path = "../mu-sdk-python"` in the DEFAULT
# `dev` group would make a plain `uv sync` FAIL for anyone who cloned mu-core by itself, because
# the sibling directory is not on their disk — a worse regression than the skip it fixes. As a
# non-default group, `uv sync` is untouched for them and `uv sync --group acceptance` installs the
# gate's dependency for everyone who actually runs the gate (infra/mu-vm/vm_test.sh does exactly
# this for mu-core, so the VM gate run never skips F1/F3 again).
acceptance = [
    "mu-sdk[embedded]",
]

# ----------------------------------------------------------------------------
# mypy — strict, gate (DEV-STANDARDS "strict static typing"; CI-blocking).
# ----------------------------------------------------------------------------
[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
warn_redundant_casts = true
warn_unused_ignores = true
disallow_any_unimported = true
no_implicit_reexport = true
show_error_codes = true
pretty = true
mypy_path = [
    "packages/mu-contracts/src",
    "packages/mu-engine/src",
    "packages/mu-local/src",
    "packages/mu-engine-server/src",
]
namespace_packages = true
explicit_package_bases = true

[[tool.mypy.overrides]]
# Third-party libs without shipped stubs — ignore missing imports at the boundary only.
module = [
    "qdrant_client.*",
    "falkordb.*",
    "litellm.*",
    "sentence_transformers.*",
    "testcontainers.*",
    "asyncpg.*",
    "pgvector.*",
    "chromadb.*",
    "faiss.*",
    "sortedcontainers.*",
    "aiomcache.*",
    "asyncmy.*",
]
ignore_missing_imports = true

# ----------------------------------------------------------------------------
# pytest — asyncio auto mode + the two required markers (DEV-STANDARDS testing).
# ----------------------------------------------------------------------------
[tool.pytest.ini_options]
minversion = "8.0"
asyncio_mode = "auto"
# src-layout namespace packages: importlib import-mode + namespace-package awareness so the
# per-package `tests/` trees (identically-named `tests` roots) collect without sys.path clashes.
consider_namespace_packages = true
testpaths = [
    "packages/mu-contracts/tests",
    "packages/mu-engine/tests",
    "packages/mu-local/tests",
    "packages/mu-engine-server/tests",
]
addopts = "-ra --strict-markers --strict-config --import-mode=importlib"
markers = [
    "unit: isolated logic; mocks permitted (DEV-STANDARDS: mocks ONLY in pure unit tests).",
    "integration: real running mu-dev-* containers, ZERO mocks (DEV-STANDARDS: non-negotiable).",
]
