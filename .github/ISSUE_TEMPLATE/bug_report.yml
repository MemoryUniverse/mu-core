name: Bug report
description: Something in mu-core behaves differently than it says it does.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Before anything else: **do not paste real memory content, credentials, or personal data
        into this form.** Redact and say what you redacted.

        If this is a security problem, do not file it here — see
        [SECURITY.md](https://github.com/MemoryUniverse/mu-core/blob/HEAD/.github/SECURITY.md).

  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What you did, and what the code did instead of what you expected.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: What you expected instead
      description: If a docstring, README or test says otherwise, quote it — that turns a report into a contradiction we can act on.
    validations:
      required: true

  - type: textarea
    id: repro
    attributes:
      label: Reproduction
      description: The smallest thing that shows it. A failing test is ideal; a script we can run is nearly as good.
      render: python
    validations:
      required: true

  - type: dropdown
    id: package
    attributes:
      label: Which package
      multiple: true
      options:
        - mu-contracts
        - mu-engine
        - mu-local
        - mu-engine-server
        - not sure
    validations:
      required: true

  - type: input
    id: commit
    attributes:
      label: Commit
      description: "`git rev-parse --short HEAD`. There is no released version yet, so the commit is the version."
      placeholder: be70c3d
    validations:
      required: true

  - type: input
    id: env
    attributes:
      label: Environment
      description: OS, Python version (`uv run python -V`), and which stores were up if any.
      placeholder: "Ubuntu 24.04 · Python 3.12.11 · in-process stores only"
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Logs or traceback
      description: Redacted. Paste the traceback, not a screenshot of it.
      render: shell

  - type: checkboxes
    id: hygiene
    attributes:
      label: Before submitting
      options:
        - label: I removed every piece of real memory content, credential and personal datum from everything above.
          required: true
        - label: I checked the open issues for this already being reported.
          required: true
