# mu-local — the embedded, daemonless, in-process engine entrypoint (PACKAGING-v2 §1.3).
# Depends on {mu-contracts, mu-engine}; NEVER mu-server (CI: mu-local-no-server).
# The LocalMemory facade — the library form of FULL-LOCAL minus the daemon.
[project]
name = "mu-local"
version = "0.1.0"
description = "Memory Universe — LocalMemory: embedded in-process engine facade (FULL-LOCAL, daemonless)."
requires-python = ">=3.12,<3.13"
license = "Apache-2.0"
readme = "README.md"
dependencies = [
    "mu-contracts",
    "mu-engine",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mu_local"]
