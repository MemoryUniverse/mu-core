# mu-contracts — the LEAN shared vocabulary (PACKAGING-v2 §1.3).
# pydantic-ONLY. No engine, no stores, no strategies, no embedders.
# The versioned public surface mu-engine / mu-local / mu-client / mu-server all pin.
[project]
name = "mu-contracts"
version = "0.1.0"
description = "Memory Universe — shared wire vocabulary: domain models, event catalog, ports, errors, config base."
requires-python = ">=3.12,<3.13"
license = "Apache-2.0"
readme = "README.md"
# No "License ::" trove classifier on purpose: PEP 639 replaced it with the `license` expression
# above, and declaring both is the deprecated form.
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries",
    "Typing :: Typed",
]
dependencies = [
    "pydantic>=2.9,<3",
    "pydantic-settings>=2.6,<3",
]

# Open-source metadata (OSS-GATE-0828): a distribution page with no link back to the source, the
# tracker or the license text is not an open-source release. mu-core ships FOUR distributions from
# ONE repo, so Repository points at the repo and the package is identified by its subdirectory.
[project.urls]
Homepage = "https://github.com/MemoryUniverse"
Repository = "https://github.com/MemoryUniverse/mu-core"
Issues = "https://github.com/MemoryUniverse/mu-core/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mu_contracts"]
